<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.League Forecast｜Jリーグ順位予測</title>
<meta name="description" content="J1・J2・J3 の順位表と、残り試合のシミュレーションによる最終順位・勝ち点予測">
<meta name="theme-color" content="#dde7e8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23e3ebeb'/%3E%3Ccircle cx='20' cy='20' r='15.5' fill='none' stroke='%231a1a1a' stroke-width='2.6'/%3E%3Cpath d='M10.5 25.5 16 21.5 21 23.5 28 15' fill='none' stroke='%231a1a1a' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='28.6' cy='14.3' r='3.4' fill='%23e56c5e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css?v=__V__">
</head>
<body>
<header class="hero">
  <div class="hero-text">
    <p class="eyebrow"><span class="brand"><svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17.5" fill="none" stroke="#1a1a1a" stroke-width="2"/><path d="M9 26.5 15.5 21.5 21 24" fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 24 28.6 14.3" fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round" stroke-dasharray=".1 4.3"/><circle cx="29.5" cy="13.4" r="3.3" fill="#e56c5e"/></svg><span class="brand-word"><b>J.League</b> Forecast</span><span class="brand-season" id="season"></span></span>
      <a class="mode-link" href="night/" data-mode-link>ダーク版<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z"/></svg></a></p>
    <h1><span class="ib">最後に笑うのは、</span><span class="ib">どこだ。</span></h1>
    <p class="hero-lead"><span class="ib">いまの順位と、</span><span class="ib">残り試合を<span id="runsHero">10,000</span>回たどった先の順位。</span><br>勝ち点の行方を、静かに数えます。</p>
  </div>
  <svg class="mark" viewBox="0 0 80 100" aria-hidden="true"><path d="M30 18c-14 6-16 30-2 34s26-20 14-30-30 14-14 34 34 12 36-6-18-26-30-10-6 30 6 44"/></svg>
</header>

<nav class="tabs" id="tabs" role="tablist">
  <button data-tab="table">順位表</button>
  <button data-tab="predict">最終予測</button>
  <button data-tab="fixtures">日程・結果</button>
  <button data-tab="stats">スタッツ</button>
  <button data-tab="insight">分析</button>
</nav>

<div class="pills" id="leagueSeg" role="tablist" aria-label="リーグ">
  <button data-league="j1">J1</button><button data-league="j2">J2</button><button data-league="j3">J3</button>
</div>

<main id="main">
  <p class="loading">読み込み中…</p>
</main>

<footer class="foot">
  <p>データ：<a href="https://data.j-league.or.jp/" target="_blank" rel="noopener">J.League Data Site</a>（<span id="updated"></span> 更新）。
  予測は今季の得点・失点から各チームの攻撃力・守備力を推定し、残り試合を<span id="runs"></span>回シミュレーションした結果です。
  J3のJFL入れ替え戦の対象は目安です。</p>
  <p><a href="night/">[ ダーク版（Night）で見る ]</a></p>
</footer>

<dialog id="teamDlg" class="sheet">
  <div class="sheet-head">
    <h2 id="dlgTitle"></h2>
    <button class="close" id="dlgClose" aria-label="閉じる">Close</button>
  </div>
  <div id="dlgBody"></div>
</dialog>

<div id="tip" class="tip" role="tooltip" hidden></div>

<script src="config.js?v=__V__"></script>
<script src="sim.js?v=__V__"></script>
<script src="app.js?v=__V__"></script>
</body>
</html>
