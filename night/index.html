<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.League Forecast Night｜Jリーグ順位予測</title>
<meta name="description" content="J1・J2・J3 の順位表と、残り試合のシミュレーションによる最終順位・勝ち点予測（ダーク版）">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%23c4e04a'/%3E%3Cstop offset='.35' stop-color='%232bc4b4'/%3E%3Cstop offset='.7' stop-color='%237c6cf0'/%3E%3Cstop offset='1' stop-color='%23c040c8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='10' fill='%23000'/%3E%3Ccircle cx='20' cy='20' r='15.5' fill='none' stroke='url%28%23g%29' stroke-width='2.6'/%3E%3Cpath d='M10.5 25.5 16 21.5 21 23.5 28 15' fill='none' stroke='%23fff' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='28.6' cy='14.3' r='3.4' fill='url%28%23g%29'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JL Forecast">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css?v=__V__">
<script>window.DATA_BASE = "../data/";</script>
</head>
<body>
<!-- 背景：ゆっくり漂う色のにじみ＋流れる線（動きを減らす設定では止まる） -->
<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i><img class="bg-lines" src="bg-lines.svg" alt=""><span class="bg-shade"></span></div>

<aside class="side">
  <div class="side-panel">
    <a class="logo" href="#top" aria-label="J.League Forecast（ページの先頭へ）">
      <svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lgMark" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#c4e04a"/><stop offset=".35" stop-color="#2bc4b4"/><stop offset=".7" stop-color="#7c6cf0"/><stop offset="1" stop-color="#c040c8"/></linearGradient></defs><circle cx="20" cy="20" r="17.5" fill="none" stroke="url(#lgMark)" stroke-width="2"/><path d="M9 26.5 15.5 21.5 21 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 24 28.6 14.3" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-dasharray=".1 4.3"/><circle cx="29.5" cy="13.4" r="3.3" fill="url(#lgMark)"/></svg>
      <span class="logo-word"><b>J.League</b> <span>Forecast</span></span>
      <span class="logo-sub"><span id="season"></span> Season</span>
    </a>
    <nav class="tabs" id="tabs" role="tablist" aria-label="表示">
      <button data-tab="table">順位表</button>
      <button data-tab="predict">最終予測</button>
      <button data-tab="fixtures">日程・結果</button>
      <button data-tab="stats">スタッツ</button>
      <button data-tab="insight">分析</button>
    </nav>
  </div>
  <div class="side-league" id="leagueSeg" role="tablist" aria-label="リーグ">
    <span class="seg"><button data-league="j1">J1</button><button data-league="j2">J2</button><button data-league="j3">J3</button></span>
  </div>
  <button class="side-cta" data-tab="predict">最終予測を見る
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M7 16V10M12 16V5M17 16v-4"/></svg>
  </button>
</aside>

<div class="content">
  <header class="hero" id="top">
    <div class="hero-text">
      <h1>Every Point,<br>Every Possibility.</h1>
      <p class="hero-ja">最後に笑うのは、どこだ。</p>
      <p class="hero-lead"><span class="ib">J1・J2・J3 のいまの順位と、</span><br><span class="ib">残り試合を<span id="runsHero">10,000</span>回たどった先の順位。</span><br><span class="ib">勝ち点の行方を、</span><span class="ib">データで確かめます。</span></p>
    </div>
  </header>

  <main id="main">
    <p class="loading">読み込み中…</p>
  </main>

  <footer class="foot">
    <p>データ：<a href="https://data.j-league.or.jp/" target="_blank" rel="noopener">J.League Data Site</a>（<span id="updated"></span> 更新）。
    予測は今季の得点・失点から各チームの攻撃力・守備力を推定し、残り試合を<span id="runs"></span>回シミュレーションした結果です。
    J3のJFL入れ替え戦の対象は目安です。</p>
  </footer>
</div>

<dialog id="teamDlg" class="sheet">
  <div class="sheet-head">
    <h2 id="dlgTitle"></h2>
    <button class="close" id="dlgClose" aria-label="閉じる"><span></span></button>
  </div>
  <div id="dlgBody"></div>
</dialog>

<div id="tip" class="tip" role="tooltip" hidden></div>

<script src="../config.js?v=__V__"></script>
<script src="../sim.js?v=__V__"></script>
<script src="../app.js?v=__V__"></script>
<script src="night.js?v=__V__"></script>
</body>
</html>
